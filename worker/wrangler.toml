name = "fps-game-server"
main = "src/entry.js"
compatibility_date = "2024-11-01"

[vars]
AC_MODE = "warn" # off | warn (log only) | enforce

[[durable_objects.bindings]]
name = "ROOM"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "CLIP"
class_name = "ClipStore"

[[durable_objects.bindings]]
name = "CLIPS_INDEX"
class_name = "ClipIndex"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ClipStore", "ClipIndex"]
